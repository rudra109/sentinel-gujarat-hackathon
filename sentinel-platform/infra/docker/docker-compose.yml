version: "3.9"

# ─── DEVELOPMENT docker-compose ──────────────────────────────────────────────
# This runs the infrastructure (DB, Redis, MinIO) in Docker.
# The FastAPI API and event-worker run locally on your machine.
#
# Usage:
#   docker-compose -f docker-compose.yml up -d
#   cd ../../services/api && uvicorn app.main:app --reload --port 8000
#   cd ../../services/event-worker && python worker.py
#
# For full Docker build (production), use docker-compose.prod.yml

services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (evidence storage) ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sentinel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
